name: Flutter

on:
  push:
    branches: [ "anoosh_kiosk3" ]
  pull_request:
    branches: [ "anoosh_kiosk3" ]

jobs:
  flutter_job:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/.flutter
          key: flutter-sdk-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.32.8

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            **/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set environment for pub
        run: |
          echo "PUB_HOSTED_URL=https://pub.dev" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.googleapis.com" >> $GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk

      - name: Prepare APK with version and date
        id: apkinfo
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n1 | cut -d ":" -f2 | cut -d "+" -f1 | xargs)
          DATE=$(date +'%Y-%m-%d')
          ARTIFACT_NAME="PosMena-Mobile-v${VERSION}-${DATE}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/$ARTIFACT_NAME
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

#      - name: Upload APK as artifact
#        uses: actions/upload-artifact@v4
#        with:
#          name: ${{ steps.apkinfo.outputs.artifact_name }}
#          path: build/app/outputs/flutter-apk/${{ steps.apkinfo.outputs.artifact_name }}

#      - name: Upload APK to Firebase App Distribution
#        run: |
#          npm install -g firebase-tools
#          firebase appdistribution:distribute build/app/outputs/flutter-apk/${{ steps.apkinfo.outputs.artifact_name }} \
#            --app 1:201954234357:android:288de664520e83742cdabc \
#            --groups app-distribution-learning \
#            --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}' > gdrive-sa.json
          echo "[gdrive]" > rclone.conf
          echo "type = drive" >> rclone.conf
          echo "scope = drive" >> rclone.conf
          echo "service_account_file = gdrive-sa.json" >> rclone.conf
          echo "root_folder_id = 1rPKxzTio9LCI7JH4fHVw_oc1ytY43Up0" >> rclone.conf

      - name: Upload APK to Google Drive
        run: |
          rclone copy build/app/outputs/flutter-apk/${{ steps.apkinfo.outputs.artifact_name }} gdrive: --config rclone.conf --progress
