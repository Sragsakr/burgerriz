openapi: 3.0.3
info:
  title: POSMena Install/Login Flow Contract
  version: 1.0.0
  description: Contract for installation validation and device PIN authentication.
paths:
  /api/TokenAuth/ValidateInstallationInfo:
    get:
      summary: Validate installation info by device IP and cluster
      parameters:
        - in: query
          name: ipAddress
          required: true
          schema:
            type: string
        - in: query
          name: clusterId
          required: true
          schema:
            type: integer
        - in: query
          name: tenderTypeId
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallValidationResponse"
  /api/TokenAuth/AuthenticateDeviceByPinCode:
    post:
      summary: Authenticate device user by PIN code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthRequest"
      responses:
        "200":
          description: Authentication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthResponse"
components:
  schemas:
    InstallValidationResponse:
      type: object
      required: [ isValid, tenantId, storeId, deviceType, message ]
      properties:
        isValid:
          type: boolean
        tenantId:
          type: integer
        storeId:
          type: integer
        deviceType:
          type: integer
          description: Device type enum value
        message:
          type: string
          description: Empty on success; newline-separated errors on failure
    DeviceAuthRequest:
      type: object
      required: [ pinCode, ipAddress, clusterId ]
      properties:
        pinCode:
          type: string
        ipAddress:
          type: string
        clusterId:
          type: integer
    DeviceAuthResponse:
      type: object
      required:
        - accessToken
        - expireInSeconds
        - userId
        - userName
        - deviceStoreId
        - deviceType
        - tenantData
        - roles
      properties:
        accessToken:
          type: string
        expireInSeconds:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        deviceStoreId:
          type: integer
        deviceType:
          type: integer
        tenantData:
          $ref: "#/components/schemas/TenantData"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
    TenantData:
      type: object
      required: [ id, tenancyName, name ]
      properties:
        id:
          type: integer
        tenancyName:
          type: string
        name:
          type: string
    UserRole:
      type: object
      required: [ roleId, roleName ]
      properties:
        roleId:
          type: integer
        roleName:
          type: string
