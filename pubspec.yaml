  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Image assets
    - assets/ads/
    - assets/global/
    - assets/icons/
    - assets/sale_type/
    - assets/menu/
    - assets/success/
    - assets/pay/
    - assets/place_holder/
    - assets/gradiants/
    - assets/videos/

    # Font assets
    - assets/fonts/
  fonts:
    - family: bank
      fonts:
        - asset: assets/fonts/ar/bank_Bold.ttf
          weight: 700
        - asset: assets/fonts/ar/bank_Regular.ttf
          weight: 400

    - family: Almarai
      fonts:
        - asset: assets/fonts/ar/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/ar/Almarai-Bold.ttf
          weight: 700

    - family: HacenTunisia
      fonts:
        - asset: assets/fonts/ar/HacenTunisia.ttf

    - family: cairo
      fonts:
        - asset: assets/fonts/ar/Cairo-Regular.ttf
          weight: 400
    - family: Rubik
      fonts:
        - asset: assets/fonts/en/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/en/Rubik-Black.ttf
          weight: 900
        - asset: assets/fonts/en/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/en/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/en/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/en/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/en/Rubik-Light.ttf
          weight: 300
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.jpg
  android_12:
    image: assets/images/logo.jpg
    color: "#ffffff"
  android: true
  ios: false
  web: false
  android_gravity: center
  fullscreen: true
